[workspace]
authors = ["mojoto"]
channels = [
  "https://conda.modular.com/max-nightly/",
  "conda-forge",
  "https://prefix.dev/pixi-build-backends",
]
description = "Human-friendly dates and times for Mojo"
license = "Apache-2.0"
license-file = "LICENSE"
name = "morrow"
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]
version = "1.1.0"

[package]
name = "morrow"
version = "1.1.0"

# Installs $PREFIX/lib/mojo/morrow.mojoc, which Mojo resolves with no `-I`.
# ICU is dlopen()ed only when a zone is missing from the system tzdata, so it
# is not a dependency.
[package.build]
backend = { name = "pixi-build-mojo", version = "0.2.*" }

[package.build.config]
pkg = { name = "morrow", path = "morrow" }

[package.build-dependencies]
mojo-compiler = "==1.2.0.dev2026100805"
mojo = "==1.2.0.dev2026100805"

[dependencies]
mojo = "==1.2.0.dev2026100805"
